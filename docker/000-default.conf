<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Cover art and folder thumbnails are served as-is, at their original
    # resolution (see Thumbnails.php) — the actual bytes over the wire are
    # the main cost when a grid shows a lot of them at once. This doesn't
    # shrink them, but it does mean a cover already shown once (paging back,
    # revisiting a collection) loads from the browser's own cache instead of
    # hitting the server again. Kept short-ish rather than a long/immutable
    # cache: a re-scan can overwrite a cover at the same filename, and this
    # is the window before a stale one falls out of cache on its own.
    <IfModule mod_headers.c>
        <FilesMatch "\.(jpg|jpeg|png|gif|webp)$">
            Header set Cache-Control "public, max-age=86400"
        </FilesMatch>
    </IfModule>

    # src/ and data/ sit outside the document root and are never served directly.

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
