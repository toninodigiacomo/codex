# RECONSTITUE par l'assistant (le fichier d'origine ne m'a jamais ete transmis).
# Si tu as l'original (git, sauvegarde Borg), compare-le avec celui-ci et garde le tien.
#
# Ce que le reste du code attend de ce fichier :
#  - DocumentRoot = public/  (le .htaccess et les liens relatifs en dependent)
#  - AllowOverride All       (sinon public/.htaccess est IGNORE : plus de routage /api/..., plus d'en-tetes de securite)
#  - mod_rewrite et mod_headers actifs (a2enmod, fait par la commande du conteneur)
#  - un Cache-Control pour les fichiers statiques (public/.htaccess le surcharge pour les images)
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <IfModule mod_headers.c>
        # css/js sont versionnes par ?v=<date du fichier> (fonction asset()) : on peut les garder longtemps
        <FilesMatch "\.(css|js|woff2?)$">
            Header set Cache-Control "public, max-age=604800"
        </FilesMatch>
        # images : public/.htaccess force "no-cache" pour png/jpg/webp/gif (couvertures remplacees sur place)
        <FilesMatch "\.(png|jpe?g|webp|gif|svg|ico)$">
            Header set Cache-Control "public, max-age=86400"
        </FilesMatch>
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
