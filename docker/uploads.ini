; Ebooks/comics/scans can be large. Raise PHP's default (tiny) upload
; limits accordingly. Loaded automatically from /usr/local/etc/php/conf.d/.

upload_max_filesize = 500M
post_max_size = 510M
max_execution_time = 300
max_input_time = 300
; 256M wasn't enough headroom for GD to decode some scanned comic covers —
; GD needs roughly width × height × 4 bytes just for the decode buffer, so a
; genuinely large scan (a few thousand pixels per side) can exceed that on
; its own before Thumbnails.php's own size guard even gets a chance to skip
; it. This crashes the whole request (a real PHP memory-exhaustion fatal
; can't be caught by any try/catch), which is what was silently killing
; "Régénérer les miniatures" partway through a library.
memory_limit = 512M
